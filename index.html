<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Noybouer - תכנון ועיצוב פנים</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --white: #FFFFFF;
            --gray-text: #666666;
            --light-gray: #F4F4F4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border-radius: 0 !important;
        }

        body {
            font-family: 'Heebo', sans-serif;
            font-weight: 300;
            color: var(--black);
            background-color: var(--white);
            line-height: 1.6;
            text-align: right;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--black);
            z-index: 1000;
            padding: 15px 0;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 10px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--white);
            font-size: 1.05rem;
        }

        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--white);
            cursor: pointer;
        }

        .hero-section {
            padding: 120px 0 40px 0;
        }

        .hero-top-row {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 10px;
        }

        .hero-logo-img {
            height: 55px;
            object-fit: contain;
        }

        .hero-tagline {
            font-size: 1.35rem;
        }

        .projects-section {
            padding: 40px 0;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 10px;
        }

        .project-card {
            background: #FAFAFA;
            display: flex;
            flex-direction: column;
        }

        .project-img-wrapper {
            height: 270px;
            overflow: hidden;
            cursor: pointer;
        }

        .project-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-info {
            padding: 20px;
        }

        footer {
            background-color: var(--black);
            color: var(--white);
            padding: 25px 0;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }

        .footer-logo-img {
            height: 38px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .footer-mobile-wrapper {
            display: none;
        }

        .desktop-footer-details {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .desktop-footer-logo {
            display: block;
        }

        /* Lightbox modal */
        #lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #FFFFFF;
            z-index: 3000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lightbox-main-container {
            position: relative;
            max-width: 900px;
            width: 100%;
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #lightbox-main-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            z-index: 10;
            padding: 10px;
            color: #333;
        }
        .lightbox-prev { right: 10px; }
        .lightbox-next { left: 10px; }

        /* --- Mobile Responsive Tweaks --- */
        @media(max-width: 900px) {
            .mobile-menu-toggle { display: block; }
            nav ul {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: var(--black);
                padding: 20px 0;
                text-align: center;
            }
            nav ul.open { display: flex; }
            .projects-grid { grid-template-columns: 1fr; }
            
            .desktop-footer-details, .desktop-footer-logo {
                display: none !important;
            }
            .footer-mobile-wrapper {
                display: flex !important;
                width: 100%;
                flex-direction: column;
                gap: 8px;
            }
            .footer-mobile-top {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
            }
            .footer-mobile-name {
                font-size: 1rem;
            }
            /* הקטנת הלוגו בפוטר במובייל ב-40% וישור לשמאל */
            .footer-mobile-logo img {
                height: 23px !important;
                width: auto;
                display: block;
            }
            .footer-mobile-row {
                display: flex;
                justify-content: space-between;
                font-size: 0.95rem;
            }
            .footer-mobile-row a {
                color: var(--white);
                text-decoration: none;
            }

            /* ביטוי החצים בגלריה במובייל והפעלת מחוות מגע */
            .lightbox-nav {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">&#9776;</button>
            <nav>
                <ul id="main-nav-list">
                    <li><a href="#home">בית</a></li>
                    <li><a href="#projects">פרויקטים</a></li>
                    <li><a href="#about">הסטודיו</a></li>
                    <li><a href="#testimonials">לקוחות מספרים</a></li>
                    <li><a href="#contact">דברו איתי</a></li>
                </ul>

    </header>

    <section id="home" class="hero-section">

            <div class="hero-tagline">כל מרחב מתחיל מסיפור</div>
            <div class="hero-logo-container">
                <img src="images/Logo.png" alt="לוגו" class="hero-logo-img">
            </div>
        </div>
    </section>

    <section id="projects" class="projects-section">
        <div class="projects-grid">
            <div class="project-card">
                <div class="project-img-wrapper" onclick="openLightbox()">
                    <img src="images/shoresh1.jpg" alt="פרויקט" class="project-img">
                </div>
                <div class="project-info">
                    <h3>משפחת שורש</h3>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <!-- Footer Mobile Wrapper -->
            <div class="footer-mobile-wrapper">
                <div class="footer-mobile-top">
                    <div class="footer-mobile-name">מעין נויבאואר</div>
                    <div class="footer-mobile-logo">
                        <img src="images/Logo.png" alt="לוגו" class="footer-logo-img">
                    </div>
                </div>
                <div class="footer-mobile-row">
                    <a href="tel:0509325563">050-9325563</a>
                    <a href="mailto:maayan.noybouer@gmail.com">maayan.noybouer@gmail.com</a>
                </div>
            </div>

            <!-- Desktop Footer -->
            <div class="footer-details desktop-footer-details">
                <span>מעין נויבאואר</span>
                <span style="border-left: 1px solid #666; height: 16px;"></span>
                <a href="tel:0509325563" style="color:white; text-decoration:none;">050-9325563</a>
                <span style="border-left: 1px solid #666; height: 16px;"></span>
                <a href="mailto:maayan.noybouer@gmail.com" style="color:white; text-decoration:none;">maayan.noybouer@gmail.com</a>
            </div>
            <img src="images/Logo.png" alt="לוגו" class="footer-logo-img desktop-footer-logo">
        </div>
    </footer>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal">
        <button style="position:absolute; top:20px; left:20px; font-size:2rem; background:none; border:none; cursor:pointer;" onclick="closeLightbox()">&times;</button>
        <div class="lightbox-main-container" id="lightbox-touch-container">
            <button class="lightbox-nav lightbox-prev" onclick="changeImage(-1)">&#10095;</button>
            <img id="lightbox-img" src="" alt="תצוגה">
            <button class="lightbox-nav lightbox-next" onclick="changeImage(1)">&#10094;</button>
        </div>
    </div>

    <script>
        function toggleMobileMenu() {
            document.getElementById('main-nav-list').classList.toggle('open');
        }

        function openLightbox() {
            document.getElementById('lightbox-modal').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').style.display = 'none';
        }

        function changeImage(dir) {
            // לוגיקת החלפת תמונות בגלריה
        }

        // תמיכה בהחלקת מגע (Swipe) במובייל לגלריה
        let touchStartX = 0;
        let touchEndX = 0;

        const touchContainer = document.getElementById('lightbox-touch-container');
        if (touchContainer) {
            touchContainer.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, false);

            touchContainer.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, false);
        }

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                // החלקה שמאלה -> תמונה הבאה
                changeImage(1);
            }
            if (touchEndX > touchStartX + 50) {
                // החלקה ימינה -> תמונה קודמת
                changeImage(-1);
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            // הגדרת יעד הפניות לכתובת maayan.noybouer@gmail.com
        }
    </script>
</body>
</html>
